services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okdriver}
      POSTGRES_USER: ${POSTGRES_USER:-okdriver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-change-me}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okdriver} -d ${POSTGRES_DB:-okdriver}"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://okdriver:demo-only-change-me@postgres:5432/okdriver}
      JWT_SECRET: ${JWT_SECRET:-local-demo-change-before-deploy}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEMO_MODE: ${DEMO_MODE:-true}
      ALERT_DEDUP_WINDOW_SECONDS: ${ALERT_DEDUP_WINDOW_SECONDS:-300}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 8
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
